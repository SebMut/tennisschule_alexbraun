name: Einmalige WordPress-Medienmigration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-wordpress-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Originalmedien aus WordPress übernehmen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/media

          base="https://www.tennisschule-alexbraun.de/wp-content/uploads"

          download() {
            yearmonth="$1"
            file="$2"
            target="$3"
            echo "Lade $yearmonth/$file"
            curl --fail --location --retry 3 --silent --show-error               "$base/$yearmonth/$file"               --output "assets/media/$target"
          }

          # Website-Logo und Hero
          download "2025/07" "Tennisschule_AB_Logo.png" "logo.png"
          download "2025/07" "header_bild.jpg" "header_bild.jpg"

          # Startseite
          download "2025/07" "startseite_1.jpg" "startseite_1.jpg"
          download "2025/07" "startseite_2.jpg" "startseite_2.jpg"
          download "2025/07" "startseite_3.jpg" "startseite_3.jpg"
          download "2025/07" "startseite_4.jpg" "startseite_4.jpg"

          # Angebote
          download "2025/07" "angebote_1.jpg" "angebote_1.jpg"
          download "2025/07" "angebote_2.jpg" "angebote_2.jpg"
          download "2025/07" "angebote_3.jpg" "angebote_3.jpg"
          download "2025/07" "angebote_4.jpg" "angebote_4.jpg"
          download "2025/07" "angebote_5.jpg" "angebote_5.jpg"
          download "2025/07" "angebote_6.jpg" "angebote_6.jpg"

          # Trainerteam
          download "2025/07" "Braun.jpg" "Braun.jpg"
          download "2025/07" "Gruber.jpg" "Gruber.jpg"
          download "2025/07" "Kellerer.jpg" "Kellerer.jpg"
          download "2025/07" "Pirok.jpg" "Pirok.jpg"
          download "2025/07" "Konitz.jpg" "Konitz.jpg"
          download "2025/07" "Fauth.jpg" "Fauth.jpg"
          download "2025/07" "Hargasser.jpg" "Hargasser.jpg"
          download "2025/07" "Schumacher.jpg" "Schumacher.jpg"

          # Standorte / Kontakt
          download "2026/01" "TSV-_logo_DinA3-370x285-1.png" "tsv-feldkirchen.png"
          download "2026/01" "SV_Heimstetten.svg_.png" "sv-heimstetten.png"
          download "2026/01" "braun_kontakt.jpg" "braun_kontakt.jpg"
          download "2026/01" "TSV-Mitgliedsantrag-NEU-2025.pdf" "TSV-Mitgliedsantrag-NEU-2025.pdf"

          # Bestehende Popup-/Aktionsgrafiken aus WordPress
          download "2025/02" "popup_wintertraining_2026_2027.png" "popup_wintertraining_2026_2027.png"
          download "2025/02" "popup_wintertraining_2026_2027-1.png" "popup_wintertraining_2026_2027-1.png"
          download "2025/02" "popup_wintertraining_2026_2027-2.png" "popup_wintertraining_2026_2027-2.png"
          download "2026/03" "2026_flyer_popup.webp" "2026_flyer_popup.webp"
          download "2026/03" "2026_schnuppertag_feldkirchen.webp" "2026_schnuppertag_feldkirchen.webp"
          download "2026/03" "2026_schnuppertag_heimstetten.webp" "2026_schnuppertag_heimstetten.webp"

      - name: Medien committen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/media && [ -z "$(git status --porcelain assets/media)" ]; then
            echo "Keine neuen Medien."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media
          git commit -m "Migrate original WordPress media"
          git push
