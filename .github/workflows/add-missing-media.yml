name: Add missing original media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-missing-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original WordPress media
        run: |
          set -euo pipefail
          mkdir -p assets/media
          curl -fsSL --retry 3 "https://www.tennisschule-alexbraun.de/wp-content/uploads/2025/07/trainerteam_2024.jpeg" -o assets/media/trainerteam_2024.jpeg
          curl -fsSL --retry 3 "https://www.tennisschule-alexbraun.de/wp-content/uploads/2026/03/2026_schnuppertag_feldkirchen.png" -o assets/media/2026_schnuppertag_feldkirchen.png
          curl -fsSL --retry 3 "https://www.tennisschule-alexbraun.de/wp-content/uploads/2026/03/2026_schnuppertag_heimstetten.png" -o assets/media/2026_schnuppertag_heimstetten.png
      - name: Commit media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add missing original WordPress media"
          git push
