name: Import local webfonts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-local-fonts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Google Fonts CSS and WOFF2 files
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          python3 - <<'PY'
          import re, urllib.request, pathlib
          url = "https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&family=Open+Sans:wght@400;600&family=Syne:wght@400;600&display=swap"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          css = urllib.request.urlopen(req, timeout=30).read().decode()
          urls = []
          for u in re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+\.woff2)\)', css):
              if u not in urls: urls.append(u)
          for i,u in enumerate(urls,1):
              name=f"font-{i:02d}.woff2"
              data=urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read()
              pathlib.Path("assets/fonts",name).write_bytes(data)
              css=css.replace(u,f"/assets/fonts/{name}")
          pathlib.Path("assets/fonts/fonts.css").write_text(css,encoding="utf-8")
          print(f"Downloaded {len(urls)} font files")
          PY
      - name: Commit local fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Host site webfonts locally"
          git push
