name: Deploy to United Domains

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DEPLOYMENT-UNITED-DOMAINS.md"
      - ".github/workflows/build-download-zips.yml"
      - ".github/workflows/php-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: united-domains-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP und JavaScript prüfen
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/site.js
          node --check admin/admin.js

      - name: SFTP-Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Serversecrets für United Domains erzeugen
        env:
          TS_ADMIN_PASSWORD: ${{ secrets.TS_ADMIN_PASSWORD }}
          TS_GITHUB_TOKEN: ${{ secrets.TS_GITHUB_TOKEN }}
          TS_SMTP_PASSWORD: ${{ secrets.TS_SMTP_PASSWORD }}
          TS_MAPBOX_TOKEN: ${{ secrets.TS_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          : "${TS_MAPBOX_TOKEN:?GitHub Secret TS_MAPBOX_TOKEN fehlt}"

          php -r '
            $adminPassword = getenv("TS_ADMIN_PASSWORD") ?: "";
            $config = [
              "admin_password_hash" => $adminPassword !== "" ? password_hash($adminPassword, PASSWORD_DEFAULT) : "",
              "github" => [
                "token" => getenv("TS_GITHUB_TOKEN"),
                "owner" => "SebMut",
                "repo" => "tennisschule_alexbraun",
                "branch" => "main",
              ],
              "mapbox" => [
                "token" => getenv("TS_MAPBOX_TOKEN") ?: "",
              ],
              "smtp" => [
                "host" => "smtps.udag.de",
                "port" => 587,
                "encryption" => "tls",
                "username" => "info@tennisschule-alexbraun.de",
                "password" => getenv("TS_SMTP_PASSWORD"),
                "from" => "info@tennisschule-alexbraun.de",
                "from_name" => "Tennisschule Alex Braun",
                "to" => "info@tennisschule-alexbraun.de",
              ],
            ];
            file_put_contents("config.local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Auf United-Domains-Testwebspace übertragen
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          UD_REMOTE_PATH: tennisschule_alexbraun_umstrukturierung
        run: |
          set -euo pipefail
          : "${UD_SFTP_HOST:?GitHub Secret UD_SFTP_HOST fehlt}"
          : "${UD_SFTP_USER:?GitHub Secret UD_SFTP_USER fehlt}"
          : "${UD_SFTP_PASSWORD:?GitHub Secret UD_SFTP_PASSWORD fehlt}"

          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$UD_REMOTE_PATH"
          cd "$UD_REMOTE_PATH"
          mirror -R --delete --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude storage/ \
            --exclude README.md \
            --exclude DEPLOYMENT-UNITED-DOMAINS.md \
            ./ .
          bye
          LFTP
