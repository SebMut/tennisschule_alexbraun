name: Deploy to United Domains

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "DEPLOYMENT-UNITED-DOMAINS.md"
      - ".github/workflows/build-download-zips.yml"
      - ".github/workflows/php-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Staging-Uploads dürfen gezielte Live-Updates nicht blockieren.
  group: ${{ contains(github.event.head_commit.message, '[deploy-live-popup]') && 'united-domains-live' || 'united-domains-staging' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: PHP und JavaScript prüfen
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/site.js
          node --check admin/admin.js

      - name: Buchungszeiträume pro Button testen
        run: php tests/booking-windows.php

      - name: Branding und Escaping der Kontakt-E-Mails testen
        run: php tests/contact-email.php

      - name: SFTP-Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Serversecrets für United Domains erzeugen
        env:
          TS_ADMIN_PASSWORD: ${{ secrets.TS_ADMIN_PASSWORD }}
          TS_GITHUB_TOKEN: ${{ secrets.TS_GITHUB_TOKEN }}
          TS_SMTP_PASSWORD: ${{ secrets.TS_SMTP_PASSWORD }}
          TS_MAPBOX_TOKEN: ${{ secrets.TS_MAPBOX_TOKEN }}
        run: |
          set -euo pipefail
          : "${TS_ADMIN_PASSWORD:?GitHub Secret TS_ADMIN_PASSWORD fehlt}"
          : "${TS_MAPBOX_TOKEN:?GitHub Secret TS_MAPBOX_TOKEN fehlt}"

          php -r '
            $adminPassword = getenv("TS_ADMIN_PASSWORD") ?: "";
            $config = [
              "admin_password_hash" => $adminPassword !== "" ? password_hash($adminPassword, PASSWORD_DEFAULT) : "",
              "admin_password_fingerprint" => $adminPassword !== "" ? hash("sha256", $adminPassword) : "",
              "github" => [
                "token" => getenv("TS_GITHUB_TOKEN"),
                "owner" => "SebMut",
                "repo" => "tennisschule_alexbraun",
                "branch" => "main",
              ],
              "mapbox" => [
                "token" => getenv("TS_MAPBOX_TOKEN") ?: "",
              ],
              "smtp" => [
                "host" => "smtps.udag.de",
                "port" => 587,
                "encryption" => "tls",
                "username" => "info@tennisschule-alexbraun.de",
                "password" => getenv("TS_SMTP_PASSWORD"),
                "from" => "info@tennisschule-alexbraun.de",
                "from_name" => "Tennisschule Alex Braun",
                "to" => "info@tennisschule-alexbraun.de",
              ],
            ];
            file_put_contents("config.local.php", "<?php\nreturn " . var_export($config, true) . ";\n");
          '

      - name: Auf United-Domains-Testwebspace übertragen
        if: ${{ !contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          UD_REMOTE_PATH: tennisschule_alexbraun_umstrukturierung
        run: |
          set -euo pipefail
          : "${UD_SFTP_HOST:?GitHub Secret UD_SFTP_HOST fehlt}"
          : "${UD_SFTP_USER:?GitHub Secret UD_SFTP_USER fehlt}"
          : "${UD_SFTP_PASSWORD:?GitHub Secret UD_SFTP_PASSWORD fehlt}"

          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$UD_REMOTE_PATH"
          cd "$UD_REMOTE_PATH"
          mirror -R --delete --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude storage/ \
            --exclude README.md \
            --exclude DEPLOYMENT-UNITED-DOMAINS.md \
            ./ .
          bye
          LFTP

      - name: Testdomain technisch prüfen
        if: ${{ !contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        continue-on-error: true
        env:
          TS_ADMIN_PASSWORD: ${{ secrets.TS_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://test.tennisschule-alexbraun.de"
          COOKIE_JAR="$(mktemp)"

          echo "Melde Healthcheck an der geschützten Testdomain an …"
          curl -fsSL --retry 5 --retry-delay 3 \
            -c "$COOKIE_JAR" -b "$COOKIE_JAR" \
            --data-urlencode "password=$TS_ADMIN_PASSWORD" \
            --data-urlencode "next=/" \
            "$BASE/test-zugang.php" -o /tmp/ts-login-result.html

          check_page() {
            local path="$1"
            local marker="$2"
            local tmp
            tmp="$(mktemp)"
            echo "Prüfe $path auf Marker: $marker"
            if ! curl -fsSL --retry 5 --retry-delay 3 -b "$COOKIE_JAR" "$BASE$path" -o "$tmp"; then
              echo "::warning::Testdomain $path ist vom GitHub-Runner nicht erreichbar."
              rm -f "$tmp"
              return 1
            fi
            if ! grep -Fq "$marker" "$tmp"; then
              echo "::warning::Marker '$marker' wurde auf $path nicht gefunden."
              head -c 500 "$tmp" || true
              echo
              rm -f "$tmp"
              return 1
            fi
            rm -f "$tmp"
          }

          check_page "/" "trust-strip"
          check_page "/angebote/" "offer-detail-card"
          check_page "/trainerteam/" "trainer-grid"
          check_page "/standorte/" "location-cards"
          check_page "/kontakt/" "name=\"topic\""
          check_page "/sitemap.xml" "<urlset"
          check_page "/robots.txt" "Sitemap:"

          home="$(mktemp)"
          curl -fsSL --retry 3 --retry-delay 2 -b "$COOKIE_JAR" "$BASE/" -o "$home"
          grep -Eq 'data-mapbox-token="[^"]+"' "$home"
          grep -Fq 'mobile-sticky-cta' "$home"
          grep -Fq 'why-section' "$home"
          rm -f "$home"

          code="$(curl -sS -b "$COOKIE_JAR" -o /tmp/ts-404.html -w '%{http_code}' "$BASE/diese-seite-gibt-es-nicht-987654/")"
          test "$code" = "404"
          grep -Fq "Seite nicht gefunden" /tmp/ts-404.html
          rm -f "$COOKIE_JAR"

      # Einmaliger, nicht-destruktiver Live-Patch der Popup-Oberfläche.
      # Nur bei einem explizit markierten Commit; CMS-Daten/Uploads/Secrets bleiben unangetastet.
      - name: Live-Popup – bisherige Quellcodes sichern
        if: ${{ contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          LIVE_REMOTE_PATH: tennisschulealexbraun
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-popup-backup"
          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          cd "$LIVE_REMOTE_PATH"
          get index.php -o "$RUNNER_TEMP/live-popup-backup/index.php"
          get admin/index.php -o "$RUNNER_TEMP/live-popup-backup/admin-index.php"
          get admin/admin.js -o "$RUNNER_TEMP/live-popup-backup/admin-admin.js"
          get _inc/site.php -o "$RUNNER_TEMP/live-popup-backup/site.php"
          get assets/site.js -o "$RUNNER_TEMP/live-popup-backup/assets-site.js"
          get assets/style.css -o "$RUNNER_TEMP/live-popup-backup/assets-style.css"
          get assets/trainings-anmeldung.css -o "$RUNNER_TEMP/live-popup-backup/trainings-anmeldung.css"
          get angebote/index.php -o "$RUNNER_TEMP/live-popup-backup/angebote-index.php"
          get api/content-validation.php -o "$RUNNER_TEMP/live-popup-backup/content-validation.php"
          get api/contact.php -o "$RUNNER_TEMP/live-popup-backup/contact.php"
          get api/smtp.php -o "$RUNNER_TEMP/live-popup-backup/smtp.php"
          get admin/admin.css -o "$RUNNER_TEMP/live-popup-backup/admin-css.css"
          bye
          LFTP
          grep -Fq "site_data()" "$RUNNER_TEMP/live-popup-backup/index.php"
          grep -Fq "admin/admin.js" "$RUNNER_TEMP/live-popup-backup/admin-index.php"

      - name: Live-Popup – Sicherheitskopie als Artefakt ablegen
        if: ${{ contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        uses: actions/upload-artifact@v4
        with:
          name: live-popup-before-${{ github.run_id }}
          path: ${{ runner.temp }}/live-popup-backup/
          retention-days: 14

      - name: Live-Popup und Trainingsbuttons – ausgewählte Quellcodedateien aktualisieren
        if: ${{ contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          LIVE_REMOTE_PATH: tennisschulealexbraun
        run: |
          set -euo pipefail
          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          cd "$LIVE_REMOTE_PATH"
          put index.php -o index.php
          put admin/index.php -o admin/index.php
          put admin/admin.js -o admin/admin.js
          put _inc/site.php -o _inc/site.php
          put assets/site.js -o assets/site.js
          put assets/style.css -o assets/style.css
          put assets/trainings-anmeldung.css -o assets/trainings-anmeldung.css
          put assets/media/smartwerk-footer-logo.png -o assets/media/smartwerk-footer-logo.png
          put angebote/index.php -o angebote/index.php
          put api/content-validation.php -o api/content-validation.php
          put api/smtp.php -o api/smtp.php
          put api/contact-mail-templates.php -o api/contact-mail-templates.php
          put api/contact.php -o api/contact.php
          get api/contact.php -o "$RUNNER_TEMP/live-contact-verify.php"
          get api/smtp.php -o "$RUNNER_TEMP/live-smtp-verify.php"
          get api/contact-mail-templates.php -o "$RUNNER_TEMP/live-template-verify.php"
          put admin/admin.css -o admin/admin.css
          bye
          LFTP
          cmp -s api/contact.php "$RUNNER_TEMP/live-contact-verify.php" || { echo "::error::Kontaktformular nicht korrekt veröffentlicht."; exit 1; }
          cmp -s api/smtp.php "$RUNNER_TEMP/live-smtp-verify.php" || { echo "::error::SMTP-Code nicht korrekt veröffentlicht."; exit 1; }
          cmp -s api/contact-mail-templates.php "$RUNNER_TEMP/live-template-verify.php" || { echo "::error::E-Mail-Design nicht korrekt veröffentlicht."; exit 1; }

      - name: Live-Popup und Trainingsbuttons – Website prüfen
        if: ${{ contains(github.event.head_commit.message, '[deploy-live-popup]') }}
        run: |
          set -euo pipefail
          admin_page="$(mktemp)"
          offers_page="$(mktemp)"
          curl -fsSL -H "Cache-Control: no-cache" "https://www.tennisschule-alexbraun.de/admin/?popup-check=${{ github.run_id }}" -o "$admin_page"
          curl -fsSL -H "Cache-Control: no-cache" "https://www.tennisschule-alexbraun.de/angebote/?booking-check=${{ github.run_id }}" -o "$offers_page"
          grep -Fq 'data-admin-tab="popup"' "$admin_page"
          grep -Fq 'admin.js?v=20261030-button-reorder' "$admin_page"
          grep -Fq 'data-booking-mode' "$offers_page"
          grep -Fq 'trainings-anmeldung.css?v=20261101-booking-availability' "$offers_page"
          css_file="$(mktemp)"
          curl -fsSL -H "Cache-Control: no-cache" "https://www.tennisschule-alexbraun.de/assets/trainings-anmeldung.css?v=${{ github.run_id }}" -o "$css_file"
          grep -Fq 'booking-availability-colors-v1' "$css_file"
          rm -f "$css_file"
          grep -Fq 'Gehostet und entwickelt von' "$offers_page"
          grep -Fq 'smartwerk-footer-logo.png' "$offers_page"
          curl -fsSL -H "Cache-Control: no-cache" "https://www.tennisschule-alexbraun.de/assets/media/smartwerk-footer-logo.png" -o /dev/null
          rm -f "$admin_page" "$offers_page"

