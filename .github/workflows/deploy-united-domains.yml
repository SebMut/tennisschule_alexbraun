name: Deploy to United Domains

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: SFTP-Werkzeug installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Auf United-Domains-Webspace übertragen
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
          UD_REMOTE_PATH: tennisschule_alexbraun_umstrukturierung
        run: |
          set -euo pipefail
          : "${UD_SFTP_HOST:?GitHub Secret UD_SFTP_HOST fehlt}"
          : "${UD_SFTP_USER:?GitHub Secret UD_SFTP_USER fehlt}"
          : "${UD_SFTP_PASSWORD:?GitHub Secret UD_SFTP_PASSWORD fehlt}"

          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mkdir -p "$UD_REMOTE_PATH"
          cd "$UD_REMOTE_PATH"
          mirror -R --delete --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude config.local.php \
            --exclude storage/ \
            --exclude README.md \
            --exclude DEPLOYMENT-UNITED-DOMAINS.md \
            ./ .
          bye
          LFTP
