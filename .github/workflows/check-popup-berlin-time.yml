name: Popup Zeitdaten Live (nur lesen)

on:
  push:
    paths:
      - ".github/workflows/check-popup-berlin-time.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: SFTP-Client installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Nur die gespeicherten Popup-Zeiten aus der Live-Datei prüfen
        env:
          UD_SFTP_HOST: ${{ secrets.UD_SFTP_HOST }}
          UD_SFTP_USER: ${{ secrets.UD_SFTP_USER }}
          UD_SFTP_PASSWORD: ${{ secrets.UD_SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${UD_SFTP_HOST:?Missing host}"
          : "${UD_SFTP_USER:?Missing user}"
          : "${UD_SFTP_PASSWORD:?Missing password}"
          umask 077
          local_file="$(mktemp)"
          trap 'rm -f "$local_file"' EXIT
          lftp -u "$UD_SFTP_USER","$UD_SFTP_PASSWORD" "sftp://$UD_SFTP_HOST" <<LFTP
          set sftp:auto-confirm yes
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          cd tennisschulealexbraun
          get data/site.json -o "$local_file"
          bye
          LFTP
          php -r '
            $data=json_decode((string)file_get_contents($argv[1]),true,512,JSON_THROW_ON_ERROR);
            $home=$data["home"]??[];
            $enabled=!empty($home["popup_enabled"]);
            $tz=new DateTimeZone("Europe/Berlin");
            echo "Popup enabled: ".($enabled?"yes":"no")."\n";
            foreach(["popup_start_at","popup_end_at"] as $key){
                $raw=(string)($home[$key]??"");
                echo "$key raw input: ".($raw!==""?$raw:"(empty)")."\n";
                $date=DateTimeImmutable::createFromFormat("!Y-m-d\TH:i",$raw,$tz);
                if($date)echo "$key interpreted in Germany: ".$date->format("Y-m-d H:i:s P T")." | UTC: ".$date->setTimezone(new DateTimeZone("UTC"))->format("Y-m-d H:i:s T")." | browser epoch: ".($date->getTimestamp()*1000)."\n";
            }
            echo "server local time Germany: ".(new DateTimeImmutable("now",$tz))->format("Y-m-d H:i:s P T")."\n";
          ' "$local_file"
