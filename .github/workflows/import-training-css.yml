name: Import original training CSS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-training-css.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original stylesheet
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://www.tennisschule-alexbraun.de/wp-content/themes/kubio/trainings-anmeldung.css" -o assets/trainings-anmeldung.css
      - name: Commit stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trainings-anmeldung.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import original training registration CSS"
          git push
